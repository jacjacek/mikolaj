name: Security regression checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: node --version
      - run: node --input-type=module --check < src/worker.js
      - run: node --input-type=module --check < public/app.js
      - run: node tests/security.mjs
