name: Security regression checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          for file in public/app.js public/demo.js src/worker.js; do node --input-type=module --check < "$file"; done
          node tests/security.mjs
