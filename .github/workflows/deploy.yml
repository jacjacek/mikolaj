name: Deploy Mikołaj

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Jedno wdrożenie naraz; z oczekujących zostaje tylko najnowsze, więc starszy commit nigdy nie nadpisze nowszego.
concurrency:
  group: mikolaj-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'master'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check syntax and run security tests
        run: |
          set -euo pipefail
          for file in public/app.js public/demo.js src/worker.js; do node --input-type=module --check < "$file"; done
          node tests/security.mjs
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.162.0 deploy --var "DEPLOY_REVISION:$GITHUB_SHA"
      - name: Verify the live revision, files, CSP and anonymous API
        run: python3 scripts/verify_deployment.py --revision "$GITHUB_SHA"
