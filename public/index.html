<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mikołaj — rodzinne listy życzeń</title>
  <meta name="description" content="Prywatne rodzinne listy życzeń. Bez dublowania prezentów i bez psucia niespodzianek.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f0f0eb">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400..500;1,6..72,400..500&amp;display=swap">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Przejdź do treści</a>

  <header class="topbar" id="topbar" hidden>
    <div class="topbar__inner container">
      <a class="brand" href="#/">
        <span class="brand__name">Mikołaj</span>
        <span class="brand__family" id="brand-family" hidden></span>
      </a>
      <nav class="nav" aria-label="Główna nawigacja">
        <a class="nav__link" href="#/" data-nav="home">
          <span class="nav__icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-family"/></svg></span><span>Rodzina</span>
        </a>
        <a class="nav__link" href="#/moja-lista" data-nav="mine">
          <span class="nav__icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-letter"/></svg></span><span>Mój list</span>
        </a>
        <a class="nav__link" href="#/rezerwacje" data-nav="reservations">
          <span class="nav__icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-gift"/></svg></span><span>Prezenty</span>
        </a>
        <a class="nav__link" href="#/zaproszenie" data-nav="invite" hidden>
          <span class="nav__icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-link"/></svg></span><span>Zaproś</span>
        </a>
      </nav>
      <div class="tools" id="tools">
        <div class="session" id="session">
          <span class="session__name" id="session-name"></span>
          <button class="icon-btn" id="logout-btn" type="button" aria-label="Wyloguj się">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-logout"/></svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div id="notice" class="notice-slot"></div>

  <main id="main" class="main" tabindex="-1">
    <div class="loading" role="status">
      <span class="spinner" aria-hidden="true"></span>
      <span>Wczytywanie…</span>
    </div>
  </main>

  <div class="toasts" aria-label="Powiadomienia">
    <div id="toast-status" class="toasts__region" role="status" aria-live="polite"></div>
    <div id="toast-alert" class="toasts__region" role="alert" aria-live="assertive"></div>
  </div>

  <noscript>
    <p class="noscript">Mikołaj potrzebuje włączonej obsługi JavaScriptu, aby działać.</p>
  </noscript>

  <!-- Ikony: jeden sprite, rysowane linią w kolorze tekstu -->
  <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-family" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.2 19.5c.6-3.2 2.9-5.3 5.8-5.3s5.2 2.1 5.8 5.3"/><circle cx="16.8" cy="9.4" r="2.5"/><path d="M15.6 14.3c.4-.1.8-.1 1.2-.1 2.4 0 4.1 1.7 4.6 4.7"/></symbol>
    <symbol id="i-letter" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="1.6"/><path d="M3.6 6.5 12 13l8.4-6.5"/></symbol>
    <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3.5" y="8" width="17" height="4" rx=".6"/><path d="M5 12v7.5h14V12M12 8v11.5"/><path d="M12 8c-1.3-2.9-4.8-4.1-5.4-1.8C6.1 8 9.4 8 12 8zm0 0c1.3-2.9 4.8-4.1 5.4-1.8C17.9 8 14.6 8 12 8z"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M15 8l4 4-4 4M19 12H9"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M18 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.5 4.5L20 16M20 20v-4h-4"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="1.6"/><path d="M8 10.5v-3a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5v.01"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.6" fill="currentColor" stroke="none"/></symbol>
  </svg>
</body>
</html>
